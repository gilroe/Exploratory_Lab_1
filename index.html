
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>My map</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style> body { margin: 0; } #map { position: absolute; inset: 0; } 
    
 /*code based off  of HTML code from W3schools.com*/   

/*creates transparent legend*/ 
#legend-controls {
  position: absolute; 
  top: 100px;
  left: 100px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
background: rgba(0, 0, 0, 0.6);
  padding: 12px;
  border-radius: 8px;
}
 /*creates button design*/ 
#legend-controls button {
  padding: 10px 14px;
  background: white;
  color: #222;
  border: 1px solid #aaa;
  border-radius: 5px;
  cursor: pointer;
  font-size: 14px;
}

#legend-controls button:hover {
  background: #eeeeee;
}
.button-symbol {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 8px;
}

.disc-golf {
  background-color: blue;
}

.golf {
  background-color: red;
}
.biodiversity {
  display: inline-block;
  width: 10px;
  height: 10px;
  background-color: green;
  border-radius: 0;
  flex-shrink: 0;
}
.biodiversity-label {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  color: #245c32;
  background-color: white;
  border: 1px solid #aaa;
  border-radius: 5px;
  font-size: 14px;
  white-space: nowrap;
}
</style>
</head>
<body>
  <!-- code from W3schools.com and youtube tutorial -->
  <div id="legend-controls">

    <h3 style="color: white";>Vermont Golf Courses & Biodiversity</h3>
    
  <button id="OnOff-discgolf">
    <span class="button-symbol disc-golf"></span>
    <span class="button-text">Disc Golf Courses (Click to Show Overlap)</span>
  </button>

  <button id="OnOff-golf">
    <span class="button-symbol golf"></span>
    <span class="button-text">Golf Courses (Click to Show Overlap)</span>
  </button>
  
 <div class="biodiversity-label">
  <span class="biodiversity"></span>
  <span>High-Biodiversity Areas</span>
  </div>
</div>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'style.json',        // the file you downloaded from Maputnik
      center: [-72.7, 44.0],    // longitude, latitude
      zoom: 7
    });
    map.addControl(new maplibregl.NavigationControl());
                // lines 105-136 based on maplibre 'change color with button', Navigation Control,                        
  const layerOnOff = [                  // and Full Screen Control Examples
    {
      buttonId: 'OnOff-discgolf',
      layerId: 'discgolf',
      label: 'Disc Golf Courses'
    },
    {
      buttonId: 'OnOff-golf',
      layerId: 'golfcourses',
      label: 'Golf Courses'
    }
  ];

  layerOnOff.forEach(({ buttonId, layerId, label }) => {
    const button = document.getElementById(buttonId);
    var visible = true;

    button.addEventListener('click', () => {
      visible = !visible;
      map.setLayoutProperty(
        layerId,
        'visibility',
        visible ? 'visible' : 'none'
      );
      button.querySelector('.button-text').textContent =
  `${label} (${visible ? 'Click to Show Overlap' : 'Click to Hide Overlap'})`;
    });
  });
    //code from Class SLides
      function onEachDiscGolf(e) {
        const course = e.features[0].properties;

        if (course.name) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(course.name);
          popup.addTo(map);
        }
      }

      map.on('click', 'discgolf', onEachDiscGolf);

      function onEachGolf(e) {
        const course = e.features[0].properties;

        if (course.SITE_NAME) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(course.SITE_NAME);
          popup.addTo(map);
        }
      }
      map.on('click', 'golfcourses', onEachGolf);
    
       function onEachDiscGolfoverlap(e) {
        const course = e.features[0].properties;

        if (course.name) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(course.name);
          popup.addTo(map);
        }
      }

      map.on('click', 'discgolfoverlap', onEachDiscGolfoverlap);

      function onEachGolfoverlap(e) {
        const course = e.features[0].properties;

        if (course.SITE_NAME) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(course.SITE_NAME);
          popup.addTo(map);
        }
      }

      map.on('click', 'golfcourseoverlap', onEachGolf);

  // Change cursor
  map.on('mouseenter', 'discgolf', () => {
    map.getCanvas().style.cursor = 'pointer';
  });
  </script>
</body>
</html>
